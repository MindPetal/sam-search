[project]
name = "sam-search"
version = "1.0.1"
description = "SAM.gov opportunity search and post to a chat channel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.18",
    "python-dateutil>=2.5.3",
    "pyyaml",
    "six>=1.10",
    "tzdata>=2026.2",
    "urllib3>=2.8.0",
]

[project.scripts]
sam-search = "sam_search.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam_search", "src/client"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "ty",
    "yamllint",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = ["src/client/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["client", "sam_search"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["src/client/", "build/"]

[tool.ty.rules]
invalid-argument-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Install Python dependencies, lint, run tests.

name: SAM-Search-Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, closed, synchronize]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  sam-search-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Set up Python
      run: uv python install 3.13
    - name: Install dependencies
      run: uv sync --locked --dev
    - name: Run yaml lint
      run: uv run yamllint -d relaxed config.yaml
    - name: Run ruff lint
      run: uv run ruff check .
    - name: Run ruff format check
      run: uv run ruff format --check .
    - name: Run ty type check
      run: uv run ty check
    - name: Run pytest unit tests
      run: uv run pytest test_search.py
    - name: Summary
      run: echo "### Summary :rocket:" >> $GITHUB_STEP_SUMMARY

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: gh extension install github/gh-actions-lock --pin v0.4.1
    - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: zizmorcore/zizmor-action@v0.8.1
      with:
        version: 1.32.0
        advanced-security: false
        annotations: true

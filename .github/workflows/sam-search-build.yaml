# Install Python dependencies, lint, run tests.

name: SAM-Search-Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, closed, synchronize]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  sam-search-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Set up Python
      run: uv python install 3.13
    - name: Install dependencies
      run: uv sync --locked --dev
    - name: Run yaml lint
      run: uv run yamllint -d relaxed config.yaml
    - name: Run ruff lint
      run: uv run ruff check .
    - name: Run ruff format check
      run: uv run ruff format --check .
    - name: Run ty type check
      run: uv run ty check
    - name: Run pytest unit tests
      run: uv run pytest test_search.py
    - name: Summary
      run: echo "### Summary :rocket:" >> $GITHUB_STEP_SUMMARY
